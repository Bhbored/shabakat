name: shabakat
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: ">=3.35.0"

dependencies:
  awesome_dio_interceptor: ^1.3.0
  connectivity_plus: ^7.2.0
  cupertino_icons: ^1.0.9
  dio: ^5.9.2
  drift: ^2.20.0
  easy_localization: ^3.0.8
  fl_chart: ^0.70.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.2.0
  freezed_annotation: ^3.1.0
  google_fonts: ^8.1.0
  json_annotation: ^4.11.0
  logger: ^2.7.0
  lucide_icons: ^0.257.0
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  sqlite3_flutter_libs: ^0.5.24
  share_plus: ^13.2.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.20.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/translations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/shabakat_logo.png
  adaptive_icon_background: "#0B0B15"
  adaptive_icon_foreground: assets/logo/shabakat_logo.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B0B15"
  image: assets/logo/shabakat_logo.png
  android_12:
    color: "#0B0B15"
    image: assets/logo/shabakat_logo.png
